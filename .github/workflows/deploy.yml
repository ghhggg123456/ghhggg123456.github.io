name: Deploy to Neocities

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate commits list
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import html
          import subprocess
          import pathlib
          import os

          repo_url = os.environ["REPO_URL"]

          fmt = "%h%x09%an%x09%ci%x09%s"
          out = subprocess.check_output(
              ["git", "log", "-50", f"--pretty=format:{fmt}"],
              text=True
          )

          divs = []
          for line in out.splitlines():
              parts = line.split("\t", 3)
              if len(parts) != 4:
                  continue
              h, author, date, subject = parts

              divs.append(
                  '<div class="commit">\n'
                  f'  <p class="commit-name">'
                  f'<span class="commit-name-head">commit</span> '
                  f'<span class="commit-name-hash">{html.escape(h)}</span> '
                  f'<span class="commit-name-date">{html.escape(date)}</span>'
                  f'</p>\n'
                  f'  <p class="commit-text">{html.escape(subject)}</p>\n'
                  '</div>'
              )

          commits_html = "\n".join(divs) if divs else "<p>Пока нет коммитов.</p>"

          p = pathlib.Path("neocities/index.html")
          content = p.read_text(encoding="utf-8")
          content = content.replace("<!-- COMMITS_LIST -->", commits_html)
          p.write_text(content, encoding="utf-8")
          PY

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v2
        with:
          api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: neocities
          cleanup: false
